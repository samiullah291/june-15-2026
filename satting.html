    <div class="main-content">
      <h1>Website Setting</h1>
      <div class="sattings-card">
        <h2>Profile Satting</h2>
        <div class="grid">
          <input type="text" placeholder="Admin Name" />
          <input type="email" placeholder="Admin Email" />
          <input type="number" placeholder="Phone Num" />
          <input type="text" placeholder="Location" />
        </div>
      </div>

      <div class="sattings-card">
        <h2>Website Satting</h2>
        <div class="grid">
          <input type="color" placeholder="website color code" />
          <input type="url" placeholder="Website url" />
          <input type="desc" placeholder="description" />
          <input type="text" placeholder="Owner" />
        </div>
      </div>

      <div class="sattings-card">
        <h2>Notification</h2>
        <label for=""> <input type="checkbox" /> Email Notification </label>
        <label for=""> <input type="checkbox" /> SMS Notification </label>
        <label for=""> <input type="checkbox" /> System Update </label>
      </div>

      <div class="sattings-card">
        <h2>Term & Condition ,Privacy policy</h2>
        <div class="grid-text">
          <label for=""
            >Privecy Police
            <textarea name="" id=""></textarea>
          </label>
          <label for=""
            >Term Condition
            <textarea name="" id=""></textarea>
          </label>
        </div>

        <button>Save All Change</button>
      </div>
